name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Built files match src/
        run: |
          python3 build.py
          git diff --exit-code index.html docs/CODEMAP.md CHANGELOG.md || (echo "::error::Built files are out of date. Run python3 build.py and commit them." && exit 1)

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm test
