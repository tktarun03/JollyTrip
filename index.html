<style>
/* Layout: BasKar's quiet single column, widened into two columns on desktop. The day's allowance sits open on the page in a thin display weight; hairlines separate the rest. Cool sea-glass neutrals + one lagoon accent. All type in rem so it follows the device text-size setting. */
:root {
  --bg: #F4F6F5;
  --surface: #FFFFFF;
  --surface-2: #ECEFEE;
  --ink: #111614;
  --ink-2: #38403D;
  --muted: #646E6A;
  --faint: #A1AAA6;
  --line: #E1E5E3;
  --line-strong: #CAD0CD;
  --accent: #1F6B67;
  --accent-soft: #E1EEEC;
  --on-ink: #FFFFFF;
  --good: #1F7A50;
  --bad: #B4432E;
  --good-soft: #E5F1EA;
  --bad-soft: #F8E7E3;
  --warn-soft: #F5EEDD;
  --scrim: rgba(8, 12, 11, 0.38);
  --shadow: 0 24px 60px rgba(17, 22, 20, 0.14);
  --f-display: 'Albert Sans', 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif;
  --f-body: 'Albert Sans', 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --t-xs: 0.6875rem;
  --t-sm: 0.75rem;
  --t-base: 0.875rem;
  --t-md: 1rem;
  --t-lg: 1.25rem;
  --t-xl: 1.75rem;
  --t-hero: 3.25rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0C0C; --surface: #121515; --surface-2: #1A1E1E; --ink: #E8ECEB; --ink-2: #C0C7C5; --muted: #8A9491; --faint: #59625F; --line: #212726; --line-strong: #333B39;
    --accent: #7CC6BE; --accent-soft: #142827; --on-ink: #0A0C0C;
    --good: #57C08E; --bad: #F07A63; --good-soft: #12251B; --bad-soft: #2C1612; --warn-soft: #29210F;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0C0C; --surface: #121515; --surface-2: #1A1E1E; --ink: #E8ECEB; --ink-2: #C0C7C5; --muted: #8A9491; --faint: #59625F; --line: #212726; --line-strong: #333B39;
  --accent: #7CC6BE; --accent-soft: #142827; --on-ink: #0A0C0C;
  --good: #57C08E; --bad: #F07A63; --good-soft: #12251B; --bad-soft: #2C1612; --warn-soft: #29210F;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}
/* Text size follows the device: Dynamic Type on iPhone/iPad, the browser's font-size setting elsewhere. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }
html[data-ts="small"] { font-size: 87.5%; }
html[data-ts="large"] { font-size: 112.5%; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--t-base); font-weight: 400; line-height: 1.5; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
*, *::before, *::after { box-sizing: border-box; }

:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; }

.app { --colmax: 100%; position: relative; height: 100%; display: flex; flex-direction: column; }
.scroller { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
.col { width: 100%; max-width: var(--colmax); margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 1.25rem 6.5rem; display: flex; flex-direction: column; gap: 1rem; }

.eyebrow { font-size: var(--t-xs); font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.hint { font-size: var(--t-sm); color: var(--muted); }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: var(--t-xs); letter-spacing: 0.02em; color: var(--muted); }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums lining-nums; font-weight: 200; letter-spacing: -0.04em; }

.md { font-size: var(--t-lg); line-height: 1.15; font-weight: 300; letter-spacing: -0.025em; }
.row { display: flex; align-items: center; gap: 0.75rem; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.stack { display: flex; flex-direction: column; gap: 0.875rem; }
.stack-xs { display: flex; flex-direction: column; gap: 0.375rem; min-width: 0; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.625rem; }
.h3 { font-size: var(--t-md); line-height: 1.3; font-weight: 400; letter-spacing: -0.01em; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 1.125rem; display: flex; flex-direction: column; gap: 0.875rem; min-width: 0; }
.card.tight { padding: 0.25rem 1.125rem; gap: 0; }
.card.mini { padding: 0.875rem 1rem; gap: 0.25rem; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; padding: 0.875rem 0 0.375rem; }

.btn { appearance: none; border: 0; border-radius: 999px; min-height: 48px; padding: 0 1.25rem; font-weight: 500; font-size: var(--t-base); cursor: pointer; background: var(--ink); color: var(--on-ink); display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; transition: opacity 0.15s ease, transform 0.12s ease; text-align: center; }
.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.985); }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; border: 1px solid var(--line-strong); color: var(--ink); }
.btn.quiet { background: var(--surface-2); color: var(--ink); }
.btn.sm { min-height: 40px; padding: 0 0.875rem; font-size: var(--t-sm); }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); }
.btn.danger.armed { background: var(--bad); color: var(--on-ink); border-color: var(--bad); }
.icon-btn { width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--line); background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-size: var(--t-sm); font-weight: 500; cursor: pointer; }

.field { display: flex; flex-direction: column; gap: 0.4rem; min-width: 0; }
.field > label, .label { font-size: var(--t-sm); font-weight: 500; color: var(--ink-2); }
.input { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 0.875rem; font-size: max(16px, 1rem); color: var(--ink); }
.input:focus { border-color: var(--ink); outline: none; }
input[type=date].input { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; line-height: 44px; }
input[type=date]::-webkit-date-and-time-value { text-align: left; }
select.input { min-width: 0; max-width: 100%; text-overflow: ellipsis; }
textarea.input { padding: 0.75rem 0.875rem; min-height: 120px; font-family: var(--f-mono); font-size: max(16px, 0.875rem); resize: vertical; }
.money-input { display: flex; align-items: baseline; gap: 0.625rem; border-bottom: 1px solid var(--line-strong); padding-bottom: 0.375rem; }
.money-input:focus-within { border-color: var(--ink); }
.money-input input { flex: 1; width: 100%; min-width: 0; border: 0; background: transparent; font-family: var(--f-display); font-size: 2.75rem; font-weight: 200; letter-spacing: -0.04em; padding: 2px 0; outline: none; font-variant-numeric: tabular-nums; }
.money-input .cur { font-family: var(--f-mono); font-size: var(--t-sm); color: var(--muted); white-space: nowrap; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }
.conv { font-size: var(--t-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.error { font-size: var(--t-sm); font-weight: 500; color: var(--bad); }
.notice { padding: 0.75rem 0.875rem; border-radius: 12px; background: var(--warn-soft); color: var(--ink); font-size: var(--t-sm); }

.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -2px; padding: 2px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 0.45rem; min-height: 38px; padding: 0 0.8rem; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: var(--t-sm); cursor: pointer; color: var(--ink); white-space: nowrap; flex-shrink: 0; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--on-ink); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); gap: 2px; }
.seg button { min-height: 38px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; color: var(--muted); font-size: var(--t-sm); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); font-weight: 500; }
.switch { width: 44px; height: 26px; flex-shrink: 0; border-radius: 999px; border: 0; background: var(--line-strong); position: relative; cursor: pointer; transition: background 0.15s; }
.switch span { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: transform 0.18s ease; }
.switch[aria-checked="true"] { background: var(--ink); }
.switch[aria-checked="true"] span { transform: translateX(18px); }
.badge { display: inline-flex; align-items: center; gap: 0.35rem; padding: 3px 9px; border-radius: 999px; font-size: var(--t-xs); font-weight: 500; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
.pill { padding: 3px 9px; border-radius: 999px; font-size: var(--t-xs); font-weight: 500; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--surface-2); color: var(--ink-2); }
.pill.sea { background: var(--accent-soft); color: var(--accent); }

/* Header */
.app-head { display: flex; align-items: flex-start; gap: 0.625rem; }
.app-head h1 { overflow-wrap: anywhere; }
.app-head h1 { font-size: var(--t-xl); line-height: 1.1; font-weight: 300; }
.brand { display: inline-flex; align-items: center; gap: 0.4rem; font-family: var(--f-display); font-size: var(--t-sm); font-weight: 500; letter-spacing: 0.02em; color: var(--accent); }

/* Hero */
.hero { display: flex; flex-direction: column; gap: 1rem; padding: 0.5rem 2px 0.25rem; }
.hero .over { color: var(--bad); }
.bar { position: relative; display: flex; gap: 2px; height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar span { height: 100%; transition: width 0.5s ease; }
.hero-foot { font-size: var(--t-sm); color: var(--ink-2); }
.explain { padding-top: 0.875rem; border-top: 1px solid var(--line); font-size: var(--t-sm); line-height: 1.55; color: var(--ink-2); }

/* Day chart */
.days-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.days { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(1.5rem, 1fr); gap: 0.375rem; align-items: end; min-width: 100%; }
.dcol { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; min-width: 0; }
.dbox { position: relative; height: 84px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.dbar { width: 100%; max-width: 16px; border-radius: 3px; }
.dbar.future { background: transparent; border: 1px dashed var(--line-strong); height: 6px; }
.damt { font-size: 0.625rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.dlab { font-size: var(--t-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.dlab.today { color: var(--accent); font-weight: 600; }
.bl { position: absolute; left: -0.19rem; right: -0.19rem; border-top: 1px dashed var(--ink-2); opacity: 0.45; pointer-events: none; z-index: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 0.875rem; font-size: var(--t-xs); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 0.375rem; }
.sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.dash { width: 14px; border-top: 1px dashed var(--ink-2); display: inline-block; }

/* Rows */
.txn { display: flex; align-items: center; gap: 0.75rem; width: 100%; padding: 0.75rem 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; color: var(--ink); }
.txn:first-child, .day-head + .txn { border-top: 0; }
.txn strong { font-size: var(--t-base); font-weight: 500; }
.tile { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid var(--line); color: var(--c); }
.amt { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex-shrink: 0; }
.amt b { font-family: var(--f-display); font-size: var(--t-base); font-weight: 400; white-space: nowrap; font-variant-numeric: tabular-nums; }
.amt span { font-size: var(--t-xs); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; padding: 1rem 0 0.375rem; }
.day-head .label { font-weight: 500; }
.crow { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0; border-top: 1px solid var(--line); }
.crow:first-child { border-top: 0; }
.cbar { height: 3px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 0.4rem; }
.cbar span { display: block; height: 100%; border-radius: 999px; background: var(--c); }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 0.625rem; padding: 0.75rem 0 1rem; }

/* Trips */
.trip { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; padding: 1.125rem; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); text-align: left; cursor: pointer; color: var(--ink); }
.trip.on { border-color: var(--ink); }
.trip h2 { font-size: var(--t-lg); font-weight: 300; }
.prog { height: 3px; border-radius: 999px; background: var(--line); overflow: hidden; }
.prog span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.prog span.over { background: var(--bad); }
.trips-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.75rem; }
.welcome { display: flex; flex-direction: column; gap: 0.875rem; padding: 1.5rem 0 0.5rem; }
.welcome h1 { font-size: 2.5rem; line-height: 1.02; font-weight: 200; letter-spacing: -0.045em; }
.welcome p { color: var(--muted); max-width: 36ch; }

/* Split */
.prow { display: flex; align-items: center; gap: 0.75rem; padding: 0.875rem 0; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.av { position: relative; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 50%; overflow: hidden; background: var(--c); color: #FFFFFF; font-family: var(--f-display); font-weight: 500; letter-spacing: 0.02em; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.av-stack { display: flex; padding-top: 4px; }
.av-stack .av { box-shadow: 0 0 0 2px var(--surface); }
.av-stack .av + .av { margin-left: -7px; }
.av-btn { position: relative; border: 0; padding: 0; background: none; border-radius: 50%; cursor: pointer; }
.av-btn .edit-dot { position: absolute; right: -2px; bottom: -2px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--on-ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--bg); }
.picker { padding: 0.75rem; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 0.625rem; }
.swatches { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--c); cursor: pointer; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink); }
.cover { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 7; border-radius: 18px; overflow: hidden; background: var(--accent-soft); }
.cover > img, .cover > svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.cover-act { position: absolute; right: 10px; bottom: 10px; background: var(--surface); color: var(--ink); box-shadow: 0 4px 14px rgba(17, 22, 20, 0.16); }
.cover-act:focus-within { outline: 1.5px solid var(--ink); outline-offset: 2px; }
.trip .cover { border-radius: 12px; aspect-ratio: 16 / 6; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.25rem, 1fr)); gap: 0.5rem; }
.thumb { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.thumb-open { display: block; width: 100%; height: 100%; border: 0; padding: 0; background: none; cursor: zoom-in; }
.thumb img, .photo-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .rm { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0, 0, 0, 0.55); color: #FFFFFF; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.thumb-add { aspect-ratio: 1; max-width: 100%; border-radius: 12px; border: 1px dashed var(--line-strong); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: var(--t-xs); cursor: pointer; }
.thumb-add:focus-within { outline: 1.5px solid var(--ink); outline-offset: 2px; }
.photo-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.photo-grid button { position: relative; aspect-ratio: 1; max-width: 100%; border: 0; padding: 0; border-radius: 10px; overflow: hidden; background: var(--surface-2); cursor: zoom-in; }
.photo-grid .more { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.45); color: #FFFFFF; font-size: var(--t-md); font-weight: 500; }
.tile.photo { border: 0; border-radius: 10px; overflow: hidden; background: var(--surface-2); position: relative; }
.tile.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* The photo viewer is dark in both themes on purpose, like any photo app. */
.lightbox { position: fixed; inset: 0; z-index: 70; background: rgba(6, 8, 8, 0.94); display: flex; align-items: center; justify-content: center; padding: calc(64px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(72px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade 0.2s ease; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
.lb-btn { position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.22); background: rgba(255, 255, 255, 0.08); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.lb-close { top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
.lb-prev { left: max(12px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); }
.lb-next { right: max(12px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); }
.lb-cap { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); text-align: center; color: rgba(255, 255, 255, 0.82); font-size: var(--t-sm); padding: 0 64px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-strong); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: var(--f-display); font-weight: 300; font-size: var(--t-sm); color: var(--ink); }
.settle { display: flex; align-items: center; gap: 0.625rem; padding: 0.875rem 0; border-top: 1px solid var(--line); font-size: var(--t-base); }
.settle:first-child { border-top: 0; }
.settle .arrow { color: var(--faint); }

/* Settings */
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 0.875rem; }
.people-row { display: grid; grid-template-columns: 42px minmax(0, 1fr) 42px; gap: 0.5rem; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.625rem; }

/* Tab bar, FAB, sheets, toast */
.tabbar { flex: none; position: relative; z-index: 30; background: var(--bg); border-top: 1px solid var(--line); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabbar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 60px; }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: var(--t-xs); color: var(--muted); cursor: pointer; position: relative; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 500; }
.tab[aria-current="page"]::after { content: ""; position: absolute; top: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.tab:disabled { opacity: 0.35; cursor: default; }
.fab { position: absolute; z-index: 31; right: max(20px, calc((100% - var(--colmax)) / 2 + 20px), env(safe-area-inset-right, 0px)); bottom: 76px; width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--ink); color: var(--on-ink); box-shadow: var(--shadow); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.12s ease; }
.fab:active { transform: scale(0.94); }
.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim); animation: fade 0.2s ease; }
.sheet { width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; background: var(--bg); border-radius: 22px 22px 0 0; padding-top: 0.625rem; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 1.125rem; animation: up 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: var(--shadow); }
.sheet-wrap.still, .sheet-wrap.still .sheet { animation: none; }
.grabber { width: 36px; height: 4px; border-radius: 999px; background: var(--line-strong); margin: 0 auto; }
.sheet h2 { font-size: var(--t-xl); font-weight: 300; }
.toast { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; z-index: 60; width: min(400px, calc(100% - 32px)); transform: translateX(-50%); padding: 0.75rem 1rem; border-radius: 16px; background: var(--ink); color: var(--on-ink); box-shadow: var(--shadow); font-size: var(--t-sm); pointer-events: none; animation: drop 0.3s ease-out; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes up { from { transform: translateY(40px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@keyframes drop { from { transform: translate(-50%, -12px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

@media (min-width: 600px) {
  .app { --colmax: 640px; }
  .col { padding-block: 2rem 7rem; gap: 1.125rem; }
  :root { --t-hero: 3.75rem; }
  .card { padding: 1.375rem; }
  .card.tight { padding: 0.375rem 1.375rem; }
  .trips-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sheet-wrap { align-items: center; padding: 24px; }
  .sheet { border-radius: 22px; max-height: 88%; padding-bottom: 1.5rem; }
  .grabber { display: none; }
}
@media (min-width: 960px) {
  .app { --colmax: 1040px; }
  .cover.banner { aspect-ratio: 21 / 6; }
  .split2 { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 1.125rem; align-items: start; }
  .split2 > div { display: flex; flex-direction: column; gap: 1.125rem; min-width: 0; }
  .narrow { max-width: 680px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
  .trips-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 959.98px) {
  .split2, .split2 > div, .narrow { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
}
</style>

      '<span class="amt"><b>' + esc(money(homeOf(ex), t.home)) + '</b>' + (foreign ? '<span>' + esc(money(ex.amt, ex.cur)) + '</span>' : '') + '</span></button>';
  }

  function viewOverview(t) {
    var c = calc(t);
    var h = header(t, t.name, esc(t.place ? t.place + ' · ' : '') + esc(range(t)));
    h += '<div class="cover banner">' + (t.cover ? photoImg(t.cover, t.name) : POSTCARD) +
      '<label class="btn sm cover-act">' + ic('camera', 16) + (t.cover ? 'Change cover' : 'Add cover photo') + '<input type="file" accept="image/*" class="sr-only" data-upload="cover-direct"></label></div>';
    var hero, explain;
    if (c.status === 'active') {
      var over = c.safe < -0.004, denom = Math.max(c.allowance, c.todaySpent, 1);
      var segs = Object.keys(CATS).filter(function (k) { return c.todayCats[k]; }).map(function (k) { return '<span style="width:' + (c.todayCats[k] / denom * 100).toFixed(2) + '%;background:' + CATS[k].color + '"></span>'; }).join('');
      hero = '<div class="row between" style="align-items:flex-end"><div class="stack-xs"><span class="eyebrow">' + (over ? 'Over today’s allowance by' : 'Safe to spend today') + '</span><span class="num hero-num' + (over ? ' over' : '') + '">' + esc(money(Math.abs(c.safe), t.home)) + '</span></div>' + statusPill(c) + '</div>' +
        '<div class="bar" role="img" aria-label="' + esc(money(c.todaySpent, t.home) + ' spent of ' + money(c.allowance, t.home)) + '">' + segs + '</div>' +
        '<div class="row between hero-foot"><span>' + esc(money(c.todaySpent, t.home)) + ' spent today</span><span class="muted">of ' + esc(money(c.allowance, t.home)) + '</span></div>';
      var adj = c.allowance - c.base;
      explain = Math.abs(adj) < 0.5 ? 'Right on your base of ' + money(c.base, t.home) + ' a day.' :
        adj > 0 ? 'Base ' + money(c.base, t.home) + ' a day, plus ' + money(adj, t.home) + ' you saved on earlier days.' :
          'Base ' + money(c.base, t.home) + ' a day, minus ' + money(-adj, t.home) + ' to cover earlier days.';
      explain += ' Each morning the rest of the budget is shared across the days left.';
    } else if (c.status === 'upcoming') {
      hero = '<div class="row between" style="align-items:flex-end"><div class="stack-xs"><span class="eyebrow">Daily budget once you land</span><span class="num hero-num">' + esc(money(c.base, t.home)) + '</span></div>' + statusPill(c) + '</div>';
      explain = 'Your ' + money(c.budget, t.home) + ' budget, minus ' + money(c.pre, t.home) + ' already booked, over ' + plural(c.n, 'day') + '.';
    } else {
      var o2 = c.left < 0;
      hero = '<div class="row between" style="align-items:flex-end"><div class="stack-xs"><span class="eyebrow">Trip total</span><span class="num hero-num">' + esc(money(c.total, t.home)) + '</span></div>' + statusPill(c) + '</div>';
      explain = o2 ? money(-c.left, t.home) + ' over your ' + money(c.budget, t.home) + ' budget.' : money(c.left, t.home) + ' under your ' + money(c.budget, t.home) + ' budget.';
      explain += ' ' + money(c.total / c.n, t.home) + ' a day on average.';
    }
    var left = '<section class="hero" aria-label="Budget">' + hero + '<p class="explain">' + esc(explain) + '</p></section>';
    var pct = c.budget ? c.total / c.budget : 0;
    left += '<div class="duo"><div class="card mini"><span class="eyebrow">Left in budget</span><span class="num md' + (c.left < 0 ? ' over' : '') + '" style="' + (c.left < 0 ? 'color:var(--bad)' : '') + '">' + esc(money(c.left, t.home)) + '</span><div class="prog" style="margin-top:6px"><span class="' + (pct > 1 ? 'over' : '') + '" style="width:' + Math.min(100, pct * 100).toFixed(1) + '%"></span></div><span class="hint">' + Math.round(pct * 100) + '% of ' + esc(money(c.budget, t.home)) + ' used</span></div>' +
      '<div class="card mini"><span class="eyebrow">Per person</span><span class="num md">' + esc(money(c.total / Math.max(t.people.length, 1), t.home)) + '</span><span class="av-stack">' + t.people.slice(0, 6).map(function (p) { return avatar(p, 24); }).join('') + '</span><span class="hint">' + esc(money(c.total, t.home)) + ' total</span></div></div>';
    left += dayChart(t, c);

    var right = catCard(t, c);
    var pics = tripPhotos(t);
    right += '<section class="card"><div class="row between"><h2 class="h3">Photos</h2><span class="hint">' + plural(pics.length, 'photo') + '</span></div>' +
      (pics.length ? '<div class="photo-grid">' + pics.slice(0, 8).map(function (p, i) { return '<button type="button" data-act="lb" data-src="trip" data-i="' + i + '" aria-label="View ' + esc(p.cap) + '">' + photoImg(p.id) + (i === 7 && pics.length > 8 ? '<span class="more">+' + (pics.length - 7) + '</span>' : '') + '</button>'; }).join('') + '</div>'
        : '<p class="hint">Attach receipts, tickets or the view to any spend. Photos stay on this device.</p>') + '</section>';
    var recent = t.expenses.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; }).slice(0, 5);
    right += '<section class="card tight"><div class="card-head"><h2 class="h3">Latest spends</h2><button type="button" class="link" data-act="tab" data-tab="spends">See all</button></div>' +
      (recent.length ? recent.map(function (ex) { return txnRow(t, ex); }).join('') : '<div class="empty"><p class="hint">Nothing logged yet. Tap + when you pay for something.</p></div>') + '<div style="height:6px"></div></section>';
    if (t.local && t.local !== t.home) right += '<p class="mono" style="padding:0 2px">Rate used for new spends: ' + esc(rateText(t)) + ' · <button type="button" class="link" data-act="edit-trip">Change</button></p>';
    return h + '<div class="split2"><div>' + left + '</div><div>' + right + '</div></div>';
  }
  function dayChart(t, c) {
    var cols = [], max = c.base * 1.4;
    for (var i = 0; i < c.n; i++) { var ds = addDays(t.start, i), v = c.byDay[ds] || 0; cols.push({ ds: ds, v: v, i: i + 1 }); if (v > max) max = v; }
    max = Math.max(max, 1);
    var H = 84, showAmt = c.n <= 10;
    var bars = cols.map(function (d) {
      var future = d.ds > c.td, isT = d.ds === c.td, col;
      if (isT) col = d.v > c.allowance ? 'var(--bad)' : 'var(--accent)';
      else col = d.v > c.base + 0.5 ? 'var(--bad)' : 'var(--faint)';
      var bar = future && !d.v ? '<div class="dbar future"></div>' : '<div class="dbar" style="height:' + Math.max(3, Math.round(d.v / max * H)) + 'px;background:' + col + '"></div>';
      return '<div class="dcol" title="' + esc(fmtD(d.ds) + ': ' + money(d.v, t.home)) + '">' + (showAmt ? '<span class="damt">' + (d.v ? esc(S.st.settings.hide ? '•' : short(d.v)) : '&nbsp;') + '</span>' : '') +
        '<div class="dbox">' + (c.base > 0 ? '<i class="bl" style="bottom:' + Math.round(c.base / max * H) + 'px"></i>' : '') + bar + '</div><span class="dlab' + (isT ? ' today' : '') + '">' + d.i + '</span></div>';
    }).join('');
    return '<section class="card"><div class="row between"><h2 class="h3">Day by day</h2><span class="hint">' + plural(c.n, 'day') + '</span></div>' +
      '<div class="days-wrap"><div class="days" role="img" aria-label="Spending per trip day">' + bars + '</div></div>' +
      '<div class="legend"><span><i class="dash"></i>Base ' + esc(money(c.base, t.home)) + '/day</span><span><i class="sw" style="background:var(--bad)"></i>Over base</span><span><i class="sw" style="background:var(--accent)"></i>Today</span></div>' +
      (c.pre ? '<p class="hint">' + esc(money(c.pre, t.home)) + ' was paid before the trip started (flights, stays, insurance). It counts toward the budget but not toward any single day.</p>' : '') + '</section>';
  }
  function catCard(t, c) {
    var keys = Object.keys(CATS).filter(function (k) { return c.byCat[k]; }).sort(function (a, b) { return c.byCat[b] - c.byCat[a]; });
    var top = keys.length ? c.byCat[keys[0]] : 1;
    return '<section class="card tight"><div class="card-head"><h2 class="h3">Where it went</h2><span class="hint">' + esc(money(c.total, t.home)) + '</span></div>' +
      (keys.length ? keys.map(function (k) {
        return '<div class="crow"><span class="tile" style="--c:' + CATS[k].color + '">' + ic(k, 17) + '</span><div class="grow"><div class="row between"><span>' + esc(CATS[k].label) + '</span><span style="font-variant-numeric:tabular-nums">' + esc(money(c.byCat[k], t.home)) + '</span></div>' +
          '<div class="row between"><div class="cbar" style="flex:1;--c:' + CATS[k].color + '"><span style="width:' + (c.byCat[k] / top * 100).toFixed(1) + '%"></span></div><span class="hint" style="width:3.2em;text-align:right">' + Math.round(c.byCat[k] / Math.max(c.total, 1) * 100) + '%</span></div></div></div>';
      }).join('') : '<div class="empty"><p class="hint">Categories appear after your first spend.</p></div>') + '<div style="height:6px"></div></section>';
  }

  function viewSpends(t) {
    var c = calc(t), f = S.filter;
    var h = header(t, 'Spends', esc(plural(t.expenses.length, 'spend') + ' · ' + money(c.total, t.home)));
    var chips = '<div class="chips scroll" role="group" aria-label="Filter by category"><button type="button" class="chip" data-act="fcat" data-cat="all" aria-pressed="' + (f.cat === 'all') + '">All</button>' +

    var search = '<label class="input row" style="border-radius:999px;gap:8px;color:var(--muted)">' + ic('search', 17) + '<input id="f-q" type="search" placeholder="Search notes" aria-label="Search spends" value="' + esc(f.q) + '" style="flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:max(16px,1rem);color:var(--ink)"></label>';

    return h + '<div class="narrow">' + tools + search + chips + '<div id="spend-list">' + spendList(t) + '</div></div>';
  }
  function spendList(t) {
    var f = S.filter, q = f.q.trim().toLowerCase();
    var list = t.expenses.filter(function (ex) { return (f.cat === 'all' || ex.cat === f.cat) && (!q || String(ex.note || '').toLowerCase().indexOf(q) >= 0 || cs(ex.cat).toLowerCase().indexOf(q) >= 0); });
    if (!list.length) return '<section class="card"><div class="empty"><p class="hint">' + (t.expenses.length ? 'No spends match this filter.' : 'No spends yet. Tap + to log the first one.') + '</p></div></section>';
    list.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    var groups = {}, order = [];
    list.forEach(function (ex) { var k = ex.date < t.start ? 'pre' : ex.date; if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(ex); });
    return '<section class="card tight">' + order.map(function (k) {

      return '<div class="day-head"><span class="label">' + esc(label) + '</span><span class="hint" style="font-variant-numeric:tabular-nums">' + esc(money(sum, t.home)) + '</span></div>' + g.map(function (ex) { return txnRow(t, ex); }).join('');
    }).join('') + '<div style="height:8px"></div></section>';
  }

  function viewSplit(t) {

    var bal = '<section class="card tight"><div class="card-head"><h2 class="h3">Balances</h2><span class="hint">in ' + esc(t.home) + '</span></div>' + rows.map(function (r) {
      var pill = r.net > 0.5 ? '<span class="pill good">Gets back ' + esc(money(r.net, t.home)) + '</span>' : r.net < -0.5 ? '<span class="pill bad">Owes ' + esc(money(-r.net, t.home)) + '</span>' : '<span class="pill info">Settled</span>';
      return '<div class="prow">' + avatar(r.p, 38) + '<div class="grow"><strong>' + esc(r.p.name) + '</strong><span class="hint">Paid ' + esc(money(r.paid, t.home)) + ' · share ' + esc(money(r.share, t.home)) + '</span></div>' + pill + '</div>';
    }).join('') + '<div style="height:6px"></div></section>';

      (set.length ? set.map(function (s) { return '<div class="settle">' + avatar(s.from, 32) + '<span class="grow"><span><strong>' + esc(s.from.name) + '</strong> ' + pays(s.from) + ' <strong>' + esc(s.to.name) + '</strong></span></span><span class="num" style="font-size:var(--t-md);font-weight:400;letter-spacing:-0.01em">' + esc(money(s.v, t.home)) + '</span></div>'; }).join('') : '<div class="empty"><p class="hint">Everyone is even.</p></div>') +
      '<div style="height:6px"></div></section><p class="hint" style="padding:0 2px">Each spend is shared equally by the people ticked on it. Spends in ' + esc(t.local || t.home) + ' are converted at the rate saved with that spend.</p><button type="button" class="btn block" data-act="share">' + ic('share', 18) + 'Share summary</button>';
    return h + '<div class="split2"><div>' + bal + '</div><div>' + st + '</div></div>';
  }

  function viewTrips() {
    var h = header(null, 'Your trips', plural(S.st.trips.length, 'trip'));
    if (!S.st.trips.length) return '<div class="welcome"><span class="brand">' + ic('sun', 14) + 'JollyTrip</span><h1>Plan the trip. Track every spend.</h1><p>Set a budget, log spends in the local currency, and JollyTrip tells you what you can spend each day and who owes whom.</p><button type="button" class="btn" data-act="new-trip" style="align-self:flex-start">' + ic('plus', 18) + ' Plan a trip</button></div>';

        '<div class="row between"><span class="num md">' + esc(money(c.total, t.home)) + '</span><span class="hint">of ' + esc(money(c.budget, t.home)) + '</span></div>' +
        '<div class="prog"><span class="' + (pct > 1 ? 'over' : '') + '" style="width:' + Math.min(100, pct * 100).toFixed(1) + '%"></span></div>' +
        '<div class="row between">' + (c.status === 'active' ? '<span class="pill sea">Day ' + c.dayIdx + ' of ' + c.n + '</span>' : c.status === 'upcoming' ? '<span class="pill info">In ' + plural(diff(today(), t.start), 'day') + '</span>' : '<span class="pill info">Finished</span>') + '<span class="av-stack">' + t.people.slice(0, 5).map(function (p) { return avatar(p, 24); }).join('') + '</span></div></button>';
    }).join('');
    return h + '<div class="trips-grid">' + cards + '</div><button type="button" class="btn ghost block" data-act="new-trip">' + ic('plus', 18) + ' Plan a new trip</button>';
  }

  /* ---------- Sheets ---------- */

  function sheetTrip() {

  function summaryText(t) {
    var c = calc(t), o = { show: true }, rows = balances(t), set = settleUp(rows);
    var L = ['JollyTrip · ' + t.name, (t.place ? t.place + ' · ' : '') + range(t) + ' · ' + plural(t.people.length, 'traveler'), ''];
    L.push('Spent ' + money(c.total, t.home, o) + ' of ' + money(c.budget, t.home, o) + ' (' + Math.round(c.budget ? c.total / c.budget * 100 : 0) + '%)');
    L.push(c.left >= 0 ? money(c.left, t.home, o) + ' left in the budget' : money(-c.left, t.home, o) + ' over budget');
    if (t.people.length > 1) L.push('Per person ' + money(c.total / t.people.length, t.home, o));
    if (c.status === 'active') L.push('Day ' + c.dayIdx + ' of ' + c.n + ' · safe to spend today ' + money(Math.max(c.safe, 0), t.home, o));
    var keys = Object.keys(CATS).filter(function (k) { return c.byCat[k]; }).sort(function (a, b) { return c.byCat[b] - c.byCat[a]; });
    if (keys.length) { L.push('', 'Where it went'); keys.forEach(function (k) { L.push('• ' + CATS[k].label + ': ' + money(c.byCat[k], t.home, o)); }); }
    if (t.people.length > 1) {
      L.push('', 'Settle up');
      if (set.length) set.forEach(function (x) { L.push('• ' + x.from.name + ' ' + pays(x.from) + ' ' + x.to.name + ' ' + money(x.v, t.home, o)); });
      else L.push('• Everyone is even');
    }
    return L.join('\n');
  }
  function csvCell(v) { v = String(v == null ? '' : v); return /[",\n\r]/.test(v) || /^[=+\-@]/.test(v) ? '"' + (/^[=+\-@]/.test(v) ? "'" : '') + v.replace(/"/g, '""') + '"' : v; }
  function csvText(t) {
    var head = ['Date', 'Trip day', 'Note', 'Category', 'Amount', 'Currency', 'Rate to ' + t.home, 'Amount in ' + t.home, 'Paid by', 'Shared by', 'Photos'];
    var rows = t.expenses.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }).map(function (x) {
      var day = x.date < t.start ? 'Before' : x.date > t.end ? 'After' : diff(t.start, x.date) + 1;
      var sh = (x.split && x.split.length ? x.split : [x.paidBy]).map(function (id) { return person(t, id).name; }).join('; ');
      return [x.date, day, x.note || '', CATS[x.cat] ? CATS[x.cat].label : 'Other', x.amt, x.cur || t.home, x.cur === t.home ? 1 : x.rate, Math.round(homeOf(x) * 100) / 100, person(t, x.paidBy).name, sh, (x.photos || []).length];
    });
    return '\uFEFF' + [head].concat(rows).map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
  }
  function pays(p) { return String(p.name).trim().toLowerCase() === 'you' ? 'pay' : 'pays'; }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'trip'; }
  function showText(title, body) { S.textOut = { title: title, body: body }; openSheet('text'); setTimeout(function () { var b = $('#text-out'); if (b) { b.focus(); b.select(); } }, 320); }
  function copyText(txt, ok, title) {
    try { navigator.clipboard.writeText(txt).then(function () { toast(ok); }, function () { showText(title, txt); }); }
    catch (e) { showText(title, txt); }
  }
  var PHONE = (function () { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } })();
  function kb(n) { return n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB'; }
  function cookieBytes() { try { return document.cookie.length; } catch (e) { return 0; } }
  function selBackup() { var b = $('#backup-box'); if (b) { b.focus(); b.select(); } }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var fn = ACT[el.dataset.act];
    if (fn) fn(el, e);
  });
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.dataset.ed && S.ed) {
      S.ed[el.dataset.ed] = el.value;
      if (el.dataset.ed === 'amt') {
        var t = trip(), c = $('#ed-conv');
        if (c && t.local !== t.home && S.ed.cur === t.local) { var r = S.ed.id && S.ed.rate && S.ed.rate !== 1 ? S.ed.rate : num(t.rate); c.textContent = num(el.value) ? '≈ ' + money(num(el.value) * r, t.home, { show: true }) + ' at ' + (r === num(t.rate) ? rateText(t) : 'the rate saved with this spend') : ''; }
      }
    } else if (el.dataset.tr && S.draft) {
      var k = el.dataset.tr;
      S.draft[k] = el.type === 'checkbox' ? el.checked : el.value;
      if (k === 'home' || k === 'local') { if (S.draft.home === S.draft.local) S.draft.rate = 1; renderSheet(); }
    } else if (el.dataset.tp != null && S.draft) {
      S.draft.people[+el.dataset.tp].name = el.value;
    } else if (el.id === 'f-q') {
      S.filter.q = el.value; var l = $('#spend-list'); if (l) l.innerHTML = spendList(trip());
    }
  });
  function handleUpload(el) {
    var kind = el.dataset.upload, files = [].slice.call(el.files || []), idx = +el.dataset.i;
    el.value = '';
    if (!files.length) return;
    if (kind === 'expense') files = files.slice(0, Math.max(0, 6 - S.ed.photos.length));
    else files = files.slice(0, 1);
    var avatarKind = kind === 'avatar';
    toast(files.length > 1 ? 'Adding ' + files.length + ' photos…' : 'Adding photo…');
    Promise.all(files.map(function (f) {
      return shrink(f, avatarKind ? 256 : 1600, avatarKind).then(function (b) { var id = 'ph_' + uid(); return Photos.put(id, b).then(function () { return id; }); }).catch(function () { return null; });
    })).then(function (ids) {
      var good = ids.filter(Boolean), bad = ids.length - good.length;
      if (good.length) {
        if (kind === 'expense' && S.ed) { S.ed.photos = S.ed.photos.concat(good); renderSheet(); }
        else if (kind === 'cover' && S.draft) { S.draft.cover = good[0]; renderSheet(); }
        else if (avatarKind && S.draft && S.draft.people[idx]) { S.draft.people[idx].photo = good[0]; renderSheet(); }
        else if (kind === 'cover-direct') { var t = trip(); if (t) { t.cover = good[0]; save(); renderView(); gc(); } }
      }
      toast(bad ? 'Couldn’t read ' + plural(bad, 'photo') + '. Try a JPEG or PNG.' : good.length > 1 ? plural(good.length, 'photo') + ' added' : 'Photo added');
    });
  }
  document.addEventListener('change', function (e) { var el = e.target; if (el.dataset && el.dataset.upload) { handleUpload(el); return; } if (el.dataset.ed && S.ed) S.ed[el.dataset.ed] = el.value; else if (el.dataset.tr && S.draft) S.draft[el.dataset.tr] = el.type === 'checkbox' ? el.checked : el.value; });
  document.addEventListener('keydown', function (e) {
    if (S.lb) { if (e.key === 'Escape') { S.lb = null; renderLb(); } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { var n = lbList().length; S.lb.i = (S.lb.i + (e.key === 'ArrowRight' ? 1 : -1) + n) % n; renderLb(); } return; }
    if (e.key === 'Escape' && S.sheet) closeSheet();
    if (e.key === 'Enter' && S.sheet === 'expense' && e.target.tagName === 'INPUT') { e.preventDefault(); ACT['ed-save'](); }
  });

  Photos.open();
  load();
  save();
  if (!S.st.trips.length) S.tab = 'trips';
  renderAll();
  Photos.ready.then(function () { gc(); });
  /* Offline + install: only when JollyTrip is hosted on its own (GitHub Pages), never inside Claude's frame. */
  if (IS_TOP && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }
  // Refresh "today" if the page stays open past midnight.
  var lastDay = today();
  setInterval(function () { if (today() !== lastDay) { lastDay = today(); renderView(); } }, 60000);
})();
</script>
