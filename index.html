<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one calm column on phones, two on desktop. The day's allowance sits open on the page in a thin display weight; hairlines separate the rest. Sea-glass neutrals with one lagoon accent, light by default. All type in rem so it follows the device text-size setting. */
:root {
  --bg: #F4F6F5;
  --surface: #FFFFFF;
  --surface-2: #ECEFEE;
  --ink: #111614;
  --ink-2: #38403D;
  --muted: #646E6A;
  --faint: #A1AAA6;
  --line: #E1E5E3;
  --line-strong: #CAD0CD;
  --accent: #1F6B67;
  --accent-soft: #E1EEEC;
  --on-ink: #FFFFFF;
  --good: #1F7A50;
  --bad: #B4432E;
  --warn: #9A5F00;
  --good-soft: #E5F1EA;
  --bad-soft: #F8E7E3;
  --warn-soft: #F5EEDD;
  --notif-bg: #111614;
  --notif-ink: #FFFFFF;
  --notif-muted: #A7B0AC;
  --paper: #FDFCF9;
  --paper-ink: #17171A;
  --paper-muted: #6C6A64;
  --stamp-bad: #B4432E;
  --stamp-good: #1F7A50;
  --scrim: rgba(8, 12, 11, 0.38);
  --shadow: 0 24px 60px rgba(17, 22, 20, 0.14);
  --f-display: 'Albert Sans', 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif;
  --f-body: 'Albert Sans', 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --t-xs: 0.6875rem;
  --t-sm: 0.75rem;
  --t-base: 0.875rem;
  --t-md: 1rem;
  --t-lg: 1.25rem;
  --t-xl: 1.75rem;
  --t-hero: 3.25rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0C0C; --surface: #121515; --surface-2: #1A1E1E; --ink: #E8ECEB; --ink-2: #C0C7C5; --muted: #8A9491; --faint: #59625F; --line: #212726; --line-strong: #333B39;
    --accent: #7CC6BE; --accent-soft: #142827; --on-ink: #0A0C0C;
    --good: #57C08E; --bad: #F07A63; --warn: #E2AE55; --good-soft: #12251B; --bad-soft: #2C1612; --warn-soft: #29210F;
    --notif-bg: #1A1E1E; --notif-ink: #E8ECEB; --notif-muted: #9AA39F;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0C0C; --surface: #121515; --surface-2: #1A1E1E; --ink: #E8ECEB; --ink-2: #C0C7C5; --muted: #8A9491; --faint: #59625F; --line: #212726; --line-strong: #333B39;
  --accent: #7CC6BE; --accent-soft: #142827; --on-ink: #0A0C0C;
  --good: #57C08E; --bad: #F07A63; --warn: #E2AE55; --good-soft: #12251B; --bad-soft: #2C1612; --warn-soft: #29210F;
  --notif-bg: #1A1E1E; --notif-ink: #E8ECEB; --notif-muted: #9AA39F;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}
/* Text size follows the device: Dynamic Type on iPhone/iPad, the browser's font-size setting elsewhere. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }
html[data-ts="small"] { font-size: 87.5%; }
html[data-ts="large"] { font-size: 112.5%; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--t-base); font-weight: 400; line-height: 1.5; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 300; letter-spacing: -0.02em; text-wrap: balance; }
p { margin: 0; }
strong { font-weight: 500; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Shell */
.app { --colmax: 100%; position: relative; height: 100%; display: flex; flex-direction: column; }
.scroller { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
.col { width: 100%; max-width: var(--colmax); margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 1.25rem 6.5rem; display: flex; flex-direction: column; gap: 1rem; min-height: 100%; }
.app.is-auth .col { padding-block: 1.25rem 2rem; gap: 1.25rem; max-width: 560px; }
.foot { margin-top: auto; padding-top: 0.5rem; }

/* Type helpers */
.eyebrow { font-size: var(--t-xs); font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.hint { font-size: var(--t-sm); color: var(--muted); }
.fine { font-size: var(--t-sm); color: var(--muted); line-height: 1.6; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: var(--t-xs); letter-spacing: 0.02em; color: var(--muted); }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums lining-nums; font-weight: 200; letter-spacing: -0.04em; }
.hero-num { font-size: var(--t-hero); line-height: 0.95; }
.md { font-size: var(--t-lg); line-height: 1.15; font-weight: 300; letter-spacing: -0.025em; }
.xl { font-size: 2.5rem; line-height: 1; }
.h2 { font-size: var(--t-xl); line-height: 1.1; }
.h3 { font-size: var(--t-md); line-height: 1.3; font-weight: 400; letter-spacing: -0.01em; }
.row { display: flex; align-items: center; gap: 0.75rem; }
.row.wrap { flex-wrap: wrap; gap: 0.5rem; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.stack { display: flex; flex-direction: column; gap: 0.875rem; }
.stack-xs { display: flex; flex-direction: column; gap: 0.375rem; min-width: 0; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.625rem; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.625rem; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }
.pad { padding: 0 2px; }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 1.125rem; display: flex; flex-direction: column; gap: 0.875rem; min-width: 0; }
.card.tight { padding: 0.25rem 1.125rem; gap: 0; }
.card.mini { padding: 0.875rem 1rem; gap: 0.25rem; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; padding: 0.875rem 0 0.375rem; }
.rows > * { border-top: 1px solid var(--line); }
.rows > *:first-child { border-top: 0; }
.spacer { height: 6px; }

/* Controls */
.btn { appearance: none; border: 0; border-radius: 999px; min-height: 48px; padding: 0 1.25rem; font-weight: 500; font-size: var(--t-base); cursor: pointer; background: var(--ink); color: var(--on-ink); display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; transition: opacity 0.15s ease, transform 0.12s ease; text-align: center; text-decoration: none; }
.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.985); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; border: 1px solid var(--line-strong); color: var(--ink); }
.btn.quiet { background: var(--surface-2); color: var(--ink); }
.btn.sm { min-height: 40px; padding: 0 0.875rem; font-size: var(--t-sm); }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); }
.btn.danger.armed { background: var(--bad); color: var(--on-ink); border-color: var(--bad); }
.icon-btn { width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--line); background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }
.icon-btn.sm { width: 34px; height: 34px; }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-size: var(--t-sm); font-weight: 500; cursor: pointer; text-decoration: none; }
.field { display: flex; flex-direction: column; gap: 0.4rem; min-width: 0; }
.field > label, .label { font-size: var(--t-sm); font-weight: 500; color: var(--ink-2); }
.input { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 0.875rem; font-size: max(16px, 1rem); color: var(--ink); }
.input:focus { border-color: var(--ink); outline: none; }
input[type=date].input, input[type=time].input { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; line-height: 44px; }
input[type=date]::-webkit-date-and-time-value, input[type=time]::-webkit-date-and-time-value { text-align: left; }
select.input { min-width: 0; max-width: 100%; text-overflow: ellipsis; }
textarea.input { padding: 0.75rem 0.875rem; min-height: 120px; line-height: 1.5; resize: vertical; }
textarea.code { font-family: var(--f-mono); font-size: max(16px, 0.8125rem); }
.money-input { display: flex; align-items: baseline; gap: 0.625rem; border-bottom: 1px solid var(--line-strong); padding-bottom: 0.375rem; }
.money-input:focus-within { border-color: var(--ink); }
.money-input input { flex: 1; width: 100%; min-width: 0; border: 0; background: transparent; font-family: var(--f-display); font-size: 2.75rem; font-weight: 200; letter-spacing: -0.04em; padding: 2px 0; outline: none; font-variant-numeric: tabular-nums; }
.money-input.sm input { font-size: 1.875rem; }
.money-input .cur { font-family: var(--f-mono); font-size: var(--t-sm); color: var(--muted); white-space: nowrap; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }
.conv { font-size: var(--t-sm); color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.2em; }
.error { font-size: var(--t-sm); font-weight: 500; color: var(--bad); }
.notice { padding: 0.75rem 0.875rem; border-radius: 12px; background: var(--warn-soft); color: var(--ink); font-size: var(--t-sm); }
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -2px; padding: 2px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 0.45rem; min-height: 38px; padding: 0 0.8rem; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: var(--t-sm); cursor: pointer; color: var(--ink); white-space: nowrap; flex-shrink: 0; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.chip .sub { color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--on-ink); }
.chip[aria-pressed="true"] .sub { color: inherit; opacity: 0.75; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); gap: 2px; }
.seg button { min-height: 38px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; color: var(--muted); font-size: var(--t-sm); padding: 0 0.25rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); font-weight: 500; }
.switch { width: 44px; height: 26px; flex-shrink: 0; border-radius: 999px; border: 0; background: var(--line-strong); position: relative; cursor: pointer; transition: background 0.15s; }
.switch::after { content: ""; position: absolute; inset: -9px; }
.switch span { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: transform 0.18s ease; }
.switch[aria-checked="true"] { background: var(--ink); }
.switch[aria-checked="true"] span { transform: translateX(18px); }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 0.875rem; }
.badge { display: inline-flex; align-items: center; gap: 0.35rem; padding: 3px 9px; border-radius: 999px; font-size: var(--t-xs); font-weight: 500; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
.badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.pill { padding: 3px 9px; border-radius: 999px; font-size: var(--t-xs); font-weight: 500; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--surface-2); color: var(--ink-2); }
.pill.sea { background: var(--accent-soft); color: var(--accent); }

/* Header */
.app-head { display: flex; align-items: flex-start; gap: 0.5rem; }
@media (max-width: 420px) { .app-head .icon-btn { width: 38px; height: 38px; } }
.app-head h1 { font-size: var(--t-xl); line-height: 1.1; font-weight: 300; overflow-wrap: anywhere; }
.trip-btn { display: inline-flex; align-items: center; gap: 0.25rem; max-width: 100%; border: 0; background: none; padding: 0; color: var(--accent); font-size: var(--t-sm); font-weight: 500; cursor: pointer; text-align: left; }
.brand { display: inline-flex; align-items: center; gap: 0.5rem; font-family: var(--f-display); font-weight: 300; font-size: 1.3rem; letter-spacing: -0.03em; color: var(--ink); }
.brand.sm { font-size: var(--t-sm); font-weight: 500; letter-spacing: 0.01em; color: var(--accent); gap: 0.35rem; }
.logo { display: block; height: 28px; width: auto; max-width: 160px; object-fit: contain; }
.brand.sm .logo { height: 18px; }
.av-btn { position: relative; border: 0; padding: 0; background: none; border-radius: 50%; cursor: pointer; flex-shrink: 0; }

/* Hero */
.hero { display: flex; flex-direction: column; gap: 1rem; padding: 0.5rem 2px 0.25rem; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 0.75rem; }
.over { color: var(--bad); }
.bar { position: relative; display: flex; gap: 2px; height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar span { height: 100%; transition: width 0.5s ease; }
.hero-foot { font-size: var(--t-sm); color: var(--ink-2); }
.bubble { padding-top: 0.875rem; border-top: 1px solid var(--line); font-size: var(--t-base); line-height: 1.5; color: var(--ink-2); display: flex; gap: 0.625rem; align-items: baseline; flex-wrap: wrap; }
.bubble .mood { font-size: var(--t-xs); font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.mascot { flex-shrink: 0; color: var(--accent); }
.hero .mascot { animation: bob 4s ease-in-out infinite; }
.cover { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 7; border-radius: 18px; overflow: hidden; background: var(--accent-soft); }
.cover > img, .cover > svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.cover-act { position: absolute; right: 10px; bottom: 10px; background: var(--surface); color: var(--ink); box-shadow: 0 4px 14px rgba(17, 22, 20, 0.16); }
.cover-act:focus-within { outline: 1.5px solid var(--ink); outline-offset: 2px; }
.cover.mini { aspect-ratio: 16 / 6; border-radius: 12px; }

/* Lists */
.txn { display: flex; align-items: center; gap: 0.75rem; width: 100%; padding: 0.75rem 0; border-left: 0; border-right: 0; border-bottom: 0; background: none; text-align: left; cursor: pointer; color: var(--ink); }
.txn strong { font-size: var(--t-base); font-weight: 500; }
.tile { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid var(--line); color: var(--c); }
.tile.sm { width: 28px; height: 28px; }
.tile.photo { border: 0; border-radius: 10px; overflow: hidden; background: var(--surface-2); position: relative; }
.tile.photo.bk-thumb { width: 56px; height: 44px; align-self: flex-start; margin-top: 2px; }
.tile.photo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tile.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.amt { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex-shrink: 0; }
.amt b { font-family: var(--f-display); font-size: var(--t-base); font-weight: 400; white-space: nowrap; font-variant-numeric: tabular-nums; }
.amt span { font-size: var(--t-xs); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; padding: 1rem 0 0.25rem; }
.crow { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0; }
.cbar { height: 3px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 0.4rem; flex: 1; }
.cbar span { display: block; height: 100%; border-radius: 999px; background: var(--c); }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 0.625rem; padding: 0.75rem 0 1rem; }
.prog { height: 3px; border-radius: 999px; background: var(--line); overflow: hidden; }
.prog span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.prog span.over { background: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 0.875rem; font-size: var(--t-xs); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 0.375rem; }
.sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.dash { width: 14px; border-top: 1px dashed var(--ink-2); display: inline-block; }

/* Itinerary */
.it { display: grid; grid-template-columns: 3.5rem 28px minmax(0, 1fr) auto; gap: 0.625rem; align-items: center; padding: 0.625rem 0; }
.dir-btn { border-color: var(--line); color: var(--accent); }
.it-time { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.it-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: var(--ink); }
.it-main strong { font-weight: 500; }
.it.done .it-main strong { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.it.bk .it-main strong { color: var(--ink-2); }
.check { position: relative; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: transparent; display: flex; align-items: center; justify-content: center; color: transparent; cursor: pointer; padding: 0; justify-self: center; }
.check::after { content: ""; position: absolute; inset: -10px; }
.check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-ink); }
.day-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 0.75rem; padding: 0.875rem 0 0.375rem; }
.day-card.today { border-color: var(--accent); }
.add-row { display: flex; align-items: center; gap: 0.5rem; width: 100%; padding: 0.75rem 0 0.875rem; border: 0; border-top: 1px dashed var(--line); background: none; color: var(--accent); font-size: var(--t-sm); font-weight: 500; cursor: pointer; text-align: left; }
.conf { font-family: var(--f-mono); font-size: var(--t-xs); letter-spacing: 0.06em; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
.pk { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; gap: 0.625rem; align-items: center; padding: 0.5rem 0; }
.pk.done span.txt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.pk-add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; }
.ready { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 0.75rem; align-items: center; width: 100%; padding: 0.75rem 0; border-left: 0; border-right: 0; border-bottom: 0; background: none; text-align: left; color: var(--ink); cursor: pointer; }

    else { title = roastOn ? 'Nicely done.' : 'Under today’s allowance'; body = 'Today’s allowance was ' + money(c.allowance) + ' and you spent ' + money(c.todaySpent) + '. You kept ' + money(c.safe) + ' for the days ahead.'; }

  }
  function sheetApplePass(sh) {
    var t = trip(), b = bookingById(t, sh.id); if (!b) return sheetHead('Add to Apple Wallet') + '<p class="hint">This booking is gone.</p>';
    var key = S.p.settings.wwKey || '', draft = sh.back && sh.back.type === 'booking' && sh.back.d.id === b.id ? sh.back.d : null, pk = bookingPkpass(draft || b); /* a pass just attached in the open booking counts before it's saved */
    return sheetHead('Add to Apple Wallet') +
      (pk ? '<section class="card"><strong>The pass you attached</strong><p class="hint">' + esc(pk.name) + '. Passes from the airline or hotel are the ones their staff can scan.</p><button type="button" class="btn" data-act="pkpass-add" data-id="' + esc(pk.id) + '">' + ic('wallet', 18) + ' Add this pass</button></section>' : '') +
      '<section class="card"><div class="row between"><strong>One tap, with WalletWallet</strong><span class="pill ' + (key ? 'good' : 'info') + '">' + (key ? 'Key saved' : 'Needs a free key') + '</span></div>' +
      '<p class="hint">Makes a pass from this booking: name, dates, travellers and a QR code of ' + (b.conf ? 'code ' + esc(b.conf) : 'the booking code (add one first for a QR code)') + '. WalletWallet’s free plan covers 1,000 passes a month. The booking details are sent to WalletWallet to sign the pass.</p>' +
      (key ? '<button type="button" class="btn" data-act="ww-make" data-id="' + esc(b.id) + '"' + (sh.busy ? ' disabled' : '') + '>' + ic('wallet', 18) + (sh.busy ? ' Making your pass…' : ' Make and add the pass') + '</button>'
        : '<div class="field"><label for="ww-key">Your WalletWallet API key</label><input id="ww-key" class="input" data-f="key" autocomplete="off" spellcheck="false" placeholder="ww_live_…" value="' + esc(sh.d.key) + '"><span class="hint">Get one free at <a class="link" href="https://www.walletwallet.dev/" target="_blank" rel="noopener">walletwallet.dev</a>. It’s stored only on this device.</span></div><button type="button" class="btn" data-act="ww-key-save">Save key and make the pass</button>') +
      '</section>' +
      '<section class="card"><strong>Free, no account: WalletWallet web tool</strong><p class="hint">Opens WalletWallet in a new tab with this booking’s details copied. Paste them in, then download the pass and tap Add. Nothing is sent until you do.</p><button type="button" class="btn quiet" data-act="ww-tool" data-id="' + esc(b.id) + '">' + ic('open', 16) + ' Copy details and open WalletWallet</button></section>' +
      errLine(sh) + '<p class="hint">WalletWallet is a third-party service, not part of ' + esc(BR.name) + '. Passes it makes are handy copies, not the airline’s or hotel’s official ticket.</p>';
  }
  function b64ToBlob(b64, type) { var bin = atob(String(b64).replace(/\s/g, '')), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: type }); }
  function makeWalletPass(b) {
    var t = trip(), sh = S.sheet, key = S.p.settings.wwKey;
    sh.busy = true; sh.err = ''; renderSheet();
    fetch(WW_API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key }, body: JSON.stringify(passFields(t, b)) })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) throw new Error('key');
        if (r.status === 429) throw new Error('limit');
        if (!r.ok) throw new Error('http ' + r.status);
        var ct = r.headers.get('Content-Type') || '';

        return r.blob().then(function (bl) { return new Blob([bl], { type: 'application/vnd.apple.pkpass' }); });
      })
      .then(function (blob) {
        var id = 'doc_' + uid();
        return Photos.put(id, blob).then(function () {
          b.files = (b.files || []).filter(function (f) { return !(isPkpass(f) && f.made); });

          save(); if (S.sheet === sh) { sh.busy = false; renderSheet(); }
          addPkpass(id);
        });
      })
      .catch(function (e) {
        if (S.sheet !== sh) return;
        sh.busy = false;
        var m = String(e && e.message || '');
        sh.err = m === 'key' ? 'WalletWallet didn’t accept the key. Remove it in More → Maps and wallet and try again.' : m === 'limit' ? 'You’ve used this month’s free passes. Use the free web tool below instead.' : (IS_TOP ? 'Couldn’t reach WalletWallet. Check your connection, or use the free web tool below.' : 'This preview blocks outside services. Open ' + BR.name + ' from its own web address, or use the free web tool below.');
        renderSheet();
      });
  }

  Object.assign(SHEETS, { maps: sheetMaps, applepass: sheetApplePass });
  Object.assign(ACT, {
    maps: function (el) {
      var q = el.dataset.q; if (!q) return;

      closeSheet();
      if (sh.remember) toast('Directions open in ' + A.label, 'Change it in More → Maps and wallet.');
    },
    'apple-pass': function (el) { var back = S.sheet && S.sheet.type !== 'applepass' ? S.sheet : null; S.pass = null; renderPass(); openSheet({ type: 'applepass', id: el.dataset.id, d: { key: '' }, back: back }); },
    'ww-key-save': function () {
      var sh = S.sheet, k = String(sh.d.key || '').trim();

      S.p.settings.wwKey = k; save(); sh.err = '';
      var b = bookingById(trip(), sh.id); if (b) makeWalletPass(b); else renderSheet();
    },
    'ww-make': function (el) { var b = bookingById(trip(), el.dataset.id); if (b) makeWalletPass(b); },

      var t = trip(), b = bookingById(t, el.dataset.id); if (!b) return;

      openLink(WW_TOOL);
      toast('Opened WalletWallet', b.conf ? 'Code ' + b.conf + ' is copied. Use it as the barcode, and the booking name as the title.' : 'Details copied. Add a booking code for a scannable pass.');
    },
    'ww-key-clear': function () { delete S.p.settings.wwKey; save(); renderView(); toast('Key removed'); }
  });
  /* =========================================================
     Backups as files, with a weekly reminder
     ========================================================= */
  var BACKUP_EVERY = 7 * DAY;
  function lastBackupText() { var lb = S.p && S.p.settings.lastBackup; if (!lb) return 'Never backed up'; var d = Math.floor((Date.now() - lb) / DAY); return 'Last backup ' + (d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'); }
  function needsBackup() {
    if (!S.p || S.p.demo) return false;
    var s = S.p.settings, now = Date.now();
    if (s.backupSnooze && now < s.backupSnooze) return false;
    var hasData = S.p.trips.some(function (t) { return t.expenses.length || t.bookings.length || t.plan.length; });
    return hasData && (!s.lastBackup || now - s.lastBackup > BACKUP_EVERY);
  }
  function backupReminder() {
    if (!needsBackup()) return '';
    return '<section class="alert warn" role="status" style="align-items:flex-start"><span class="tile" style="--c:var(--warn)">' + ic('download', 18) + '</span><span class="grow"><strong>Back up your trips</strong><span class="hint">' + esc(lastBackupText()) + '. Your trips live only on this phone. Save a backup file to Files or iCloud Drive so you can get them back.</span><span class="row wrap" style="margin-top:8px"><button type="button" class="btn sm" data-act="backup-file">Save backup</button><button type="button" class="btn ghost sm" data-act="backup-snooze">Later</button></span></span></section>';
  }
  function backupName() { var d = new Date(); return slug(BR.name) + '-backup-' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '.json'; }
  function markBackedUp() { S.p.settings.lastBackup = Date.now(); delete S.p.settings.backupSnooze; save(); }
  function sheetBackupReady(sh) {
    var canShare = IS_TOP && navigator.canShare && (function () { try { return navigator.canShare({ files: [new File(['{}'], 'x.json', { type: 'application/json' })] }); } catch (e) { return false; } })();
    return sheetHead('Your backup is ready') + '<div class="lock" style="padding:0.5rem 0 0"><span class="flame" style="width:72px;height:72px">' + ic('download', 32) + '</span><h3 class="h3">' + esc(sh.name) + '</h3><p class="hint">' + esc(kb(sh.txt.length)) + ' · ' + plural(sh.trips, 'trip') + (sh.photos ? ' and ' + plural(sh.photos, 'photo or file', 'photos and files') : '') + '</p></div>' +
      (IS_TOP ? '<button type="button" class="btn block" data-act="backup-share">' + ic('download', 18) + (canShare ? ' Save to Files or iCloud Drive' : ' Download the file') + '</button>' : '<p class="notice">This preview can’t save files. Copy the backup instead, or open ' + esc(BR.name) + ' from its own web address.</p>') +
      '<button type="button" class="btn ghost block" data-act="backup-copy">' + ic('copy', 16) + ' Copy as text instead</button>' +
      '<p class="hint">' + (canShare ? 'In the share sheet, choose Save to Files, then pick iCloud Drive so it’s safe even if you lose this phone. ' : '') + 'To restore, go to More → Restore from backup and choose this file.</p>';
  }

  /* =========================================================
     Calendar export (.ics) with alerts
     ========================================================= */
  function icsEsc(s) { return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
  /* Lines fold at 75 bytes of UTF-8, never splitting a character. */
  function u8len(ch) { var c = ch.codePointAt(0); return c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4; }
  function icsFold(line) { var out = [], cur = '', n = 0; Array.from(line).forEach(function (ch) { var l = u8len(ch); if (n + l > 75) { out.push(cur); cur = ' '; n = 1; } cur += ch; n += l; }); out.push(cur); return out.join('\r\n'); }
  function icsStamp() { var d = new Date(); return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z'; }
  function icsDT(ds, hm) { return ds.replace(/-/g, '') + 'T' + String(hm).replace(':', '') + '00'; }
  function plusMin(ds, hm, mins) { var p = hm.split(':'), d = D(ds); d.setHours(+p[0], +p[1] + mins, 0, 0); return { ds: iso(d), hm: pad(d.getHours()) + ':' + pad(d.getMinutes()) }; }
  /* Times are "floating": they follow the phone's time zone, which is the local one while you travel. */
  function icsEvent(o) {
    var L = ['BEGIN:VEVENT', 'UID:' + o.uid + '@jollytrip', 'DTSTAMP:' + icsStamp(), 'SUMMARY:' + icsEsc(o.title)];
    if (o.hm) { var e = plusMin(o.ds, o.hm, o.mins || 60); L.push('DTSTART:' + icsDT(o.ds, o.hm), 'DTEND:' + icsDT(e.ds, e.hm)); }
    else { L.push('DTSTART;VALUE=DATE:' + o.ds.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + addDays(o.endDs || o.ds, o.endDs ? 0 : 1).replace(/-/g, '')); L.push('TRANSP:TRANSPARENT'); }
    if (o.loc) L.push('LOCATION:' + icsEsc(o.loc));
    if (o.desc) L.push('DESCRIPTION:' + icsEsc(o.desc));
    if (o.alarm) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(o.title), 'TRIGGER:-PT' + o.alarm + 'M', 'END:VALARM');

  }
  function icsWrap(name, events) { return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//' + icsEsc(BR.name) + '//Trip planner//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', icsFold('X-WR-CALNAME:' + icsEsc(name))].join('\r\n') + '\r\n' + events.join('\r\n') + '\r\nEND:VCALENDAR\r\n'; }
  function bookingEventsIcs(t, b) {
    var T = BKT[b.type] || BKT.other, loc = b.address || (b.type !== 'flight' ? placeQuery(t, b.name) : '');
    var desc = [T.label + (b.provider ? ' · ' + b.provider : ''), b.conf ? 'Booking code: ' + b.conf : '', b.notes ? b.notes.slice(0, 400) : '', 'From ' + BR.name + ' · ' + t.name].filter(Boolean).join('\n');
    var startAlarm = b.type === 'flight' ? 180 : b.time ? 60 : 900, out = [];
    out.push(icsEvent({ uid: b.id + '-a', title: (T.a ? T.a + ': ' : '') + b.name, ds: b.start, hm: b.time, mins: b.type === 'flight' ? 120 : 60, loc: loc, desc: desc, alarm: startAlarm }));
    if (T.hasEnd && b.end && (b.end !== b.start || b.endTime)) out.push(icsEvent({ uid: b.id + '-b', title: (T.b || 'Ends') + ': ' + b.name, ds: b.end, hm: b.endTime, mins: b.type === 'flight' ? 120 : 30, loc: loc, desc: desc, alarm: b.type === 'flight' ? 180 : b.endTime ? 60 : 900 }));
    var st = bookingState(t, b);
    if (b.due && (st.st === 'unpaid' || st.st === 'part')) out.push(icsEvent({ uid: b.id + '-due', title: 'Pay balance: ' + b.name + ' (' + money(st.left, t.home, { show: true }) + ')', ds: b.due, desc: desc, alarm: 900 }));
    return out;
  }
  function tripIcs(t) {
    var ev = [icsEvent({ uid: t.id + '-trip', title: t.name + (t.place ? ' · ' + t.place : ''), ds: t.start, endDs: addDays(t.end, 1), desc: 'Trip planned in ' + BR.name + '. ' + plural(t.people.length, 'traveller') + '.' })];
    t.bookings.forEach(function (b) { ev = ev.concat(bookingEventsIcs(t, b)); });
    t.plan.forEach(function (it) { if (!inTrip(t, it.day)) return; ev.push(icsEvent({ uid: it.id, title: it.title, ds: it.day, hm: it.time, mins: 60, loc: placeQuery(t, it.place), desc: [(PLK[it.kind] || PLK.sight).label, it.notes].filter(Boolean).join('\n'), alarm: it.time ? 30 : 0 })); });
    return icsWrap(t.name, ev);
  }
  function openIcs(text, name) {
    if (!IS_TOP) { toast('Open ' + BR.name + ' from its own web address', 'This preview can’t hand files to Calendar.'); return; }
    var blob = new Blob([text], { type: 'text/calendar;charset=utf-8' }), u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; if (!/iPhone|iPad|Macintosh/.test(navigator.userAgent)) a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 60000);
    toast('Opening Calendar', /iPhone|iPad/.test(navigator.userAgent) ? 'Tap Add All to add the events with their alerts.' : 'Open the downloaded file to add the events to your calendar.');
  }
  function calCount(t) { var n = 1; t.bookings.forEach(function (b) { n += bookingEventsIcs(t, b).length; }); t.plan.forEach(function (it) { if (inTrip(t, it.day)) n++; }); return n; }

  Object.assign(SHEETS, { backupready: sheetBackupReady });
  Object.assign(ACT, {
    'backup-file': function () {
      toast('Preparing backup', 'Photos are included, so this can take a moment.');
      buildBackup().then(function (txt) { var o = JSON.parse(txt); hideToast(); openSheet({ type: 'backupready', txt: txt, name: backupName(), trips: (o.trips || []).length, photos: Object.keys(o.photos || {}).length }); });
    },
    'backup-share': function () {
      var sh = S.sheet, file;
      try { file = new File([sh.txt], sh.name, { type: 'application/json' }); } catch (e) { file = null; }
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: sh.name }).then(function () { markBackedUp(); closeSheet(); renderView(); toast('Backup saved', sh.name); }, function (e) { if (!e || e.name !== 'AbortError') toast('Couldn’t share the file', 'Try Copy as text instead.'); });
        return;
      }
      var u = URL.createObjectURL(new Blob([sh.txt], { type: 'application/json' })), a = document.createElement('a');
      a.href = u; a.download = sh.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 60000);
      markBackedUp(); closeSheet(); renderView(); toast('Backup downloaded', sh.name + '. Keep it somewhere safe, like iCloud Drive or Google Drive.');
    },
    'backup-copy': function () {
      var sh = S.sheet, txt = sh.txt;
      try { navigator.clipboard.writeText(txt).then(function () { markBackedUp(); closeSheet(); renderView(); toast('Backup copied', kb(txt.length) + '. Paste it somewhere safe, like a note or an email to yourself.'); }, function () { showText('Your backup', txt, kb(txt.length) + '. Tap Copy, then paste it somewhere safe.'); markBackedUp(); }); }
      catch (e) { showText('Your backup', txt, kb(txt.length) + '. Tap Copy, then paste it somewhere safe.'); markBackedUp(); }
    },
    'backup-snooze': function () { S.p.settings.backupSnooze = Date.now() + 3 * DAY; save(); renderView(); toast('Reminder in 3 days'); },
    'cal-trip': function () { var t = trip(); if (!t) return; openIcs(tripIcs(t), slug(t.name) + '.ics'); },
    'cal-booking': function (el) { var t = trip(), b = bookingById(t, el.dataset.id); if (!b) return; openIcs(icsWrap(b.name, bookingEventsIcs(t, b)), slug(b.name) + '.ics'); }
  });
  /* =========================================================
     Start
     ========================================================= */
  /* No pinch or double-tap zoom: the viewport is fixed, and iOS gesture events are cancelled. Text size is in More → Appearance. */
  (function () {
    var vp = document.querySelector('meta[name="viewport"]');
    if (!vp) { vp = document.createElement('meta'); vp.name = 'viewport'; document.head.appendChild(vp); }
    vp.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false }); });
    document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
    document.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  })();
  Store.init();
  BR = cleanBrand(Store.get('jt_brand')); applyBrand();
  S.index = Store.get('jt_idx') || { v: 1, profiles: [] };
  if (!Array.isArray(S.index.profiles)) S.index = { v: 1, profiles: [] };
  S.legacy = legacyData();
  Photos.open();
  var sess = Store.get('jt_sess');
  if (sess && sess.pid && meta(sess.pid) && loadProfile(sess.pid) && lockEnabled(meta(sess.pid))) lockApp();
  renderAll();
  bioCheck().then(function () { if (S.locked || (S.p && S.tab === 'more' && !S.sheet)) renderView(); });
  Photos.ready.then(function () { gc(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      S.hiddenAt = Date.now();
      if (S.p && S.pid && !S.locked) { var j = snapJson(); if (j !== S.lastSnapJson && Date.now() - S.lastAutoAt >= 5 * 60000) snapshot('auto', '', j); }
    } else if (S.p && !S.locked && S.hiddenAt) {
      var m = meta(), after = m && m.lockAfter != null ? +m.lockAfter : 5;
      if (lockEnabled(m) && Date.now() - S.hiddenAt >= after * 60000) { lockApp(); renderAll(); }
    }
  });
  (function () {
    var seen = Store.get('jt_ver');
    if (seen !== APP_VERSION) {
      Store.set('jt_ver', APP_VERSION);
      if (seen || S.index.profiles.length) setTimeout(function () { toast('Updated to version ' + APP_VERSION, CHANGELOG[0].items[0], { label: 'What’s new', act: 'about' }); }, 900);
    }
  })();
  /* Auto-lock after a stretch with no touches, clicks, typing or scrolling. */
  S.lastActive = Date.now();
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (n) { document.addEventListener(n, function () { S.lastActive = Date.now(); }, { passive: true, capture: true }); });
  document.addEventListener('scroll', function () { S.lastActive = Date.now(); }, { passive: true, capture: true });
  setInterval(function () {
    if (!S.p || S.locked || document.visibilityState !== 'visible') return;
    var m = meta();
    if (lockEnabled(m) && Date.now() - S.lastActive >= idleMinutes(m) * 60000) { lockApp(); renderAll(); toast('Locked', 'No activity for ' + plural(idleMinutes(m), 'minute') + '.'); }
  }, 15000);
  var lastDay = today();
  setInterval(function () { if (today() !== lastDay) { lastDay = today(); renderView(); } }, 60000);
  /* Offline + install: only when hosted on its own (GitHub Pages), never inside Claude's frame. */
  if (IS_TOP && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }
})();
